<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Page Not Found | Click Grow Digital
    </title>

    <meta name="description"
          content="The page you're looking for could not be found. Return to Click Grow Digital and explore our digital marketing services.">

    <meta name="robots"
          content="noindex, follow">


    <!-- Favicon -->

    <link rel="icon"
          href="images/logo.png">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Main Styles -->

    <link rel="stylesheet"
          href="css/style.css">


    <!-- 404 Styles -->

    <link rel="stylesheet"
          href="css/404.css">


    <!-- Footer Styles -->

    <link rel="stylesheet"
          href="css/footer.css">

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <div id="header"></div>



    <!-- ==========================================
         404 PAGE
    ========================================== -->

    <main class="error-page">


        <div class="error-background-glow"></div>


        <div class="container">


            <div class="error-content">


                <!-- 404 -->

                <div class="error-number">

                    404

                </div>



                <!-- Tag -->

                <span class="section-tag">

                    PAGE NOT FOUND

                </span>



                <!-- Heading -->

                <h1>

                    Looks Like You've
                    Lost Your Way.

                </h1>



                <!-- Description -->

                <p>

                    The page you're looking for doesn't exist,
                    has been moved, or may no longer be available.

                    Don't worry — let's get you back to
                    Click Grow Digital.

                </p>



                <!-- Buttons -->

                <div class="error-buttons">


                    <a href="index.html"
                       class="btn">

                        <i class="fas fa-house"></i>

                        Back To Home

                    </a>


                    <a href="contact.html"
                       class="btn-outline">

                        Contact Us

                        <i class="fas fa-arrow-right"></i>

                    </a>


                </div>



                <!-- Quick Links -->

                <div class="error-links">

                    <span>

                        Explore

                    </span>


                    <a href="services.html">

                        Services

                    </a>


                    <a href="portfolio.html">

                        Portfolio

                    </a>


                    <a href="team.html">

                        Team

                    </a>


                    <a href="testimonials.html">

                        Testimonials

                    </a>


                    <a href="contact.html">

                        Contact

                    </a>

                </div>


            </div>


        </div>


    </main>



    <!-- ==========================================
         FOOTER
    ========================================== -->

    <div id="footer"></div>



    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/include.js"></script>

    <script src="js/main.js"></script>

    <script src="js/animations.js"></script>


</body>

</html>
